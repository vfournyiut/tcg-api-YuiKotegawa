paths:
  /api/cards:
    get:
      tags:
        - Cards
      summary: Liste toutes les cartes
      description: |
        Récupère la liste complète des cartes Pokémon disponibles.
        
        **Caractéristiques :**
        - Authentification requise (token JWT)
        - Triées par numéro Pokédex croissant
        - Contient toutes les informations de la carte
      operationId: getAllCards
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste des cartes récupérée avec succès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Card'
              example:
                - id: 1
                  name: "Bulbasaur"
                  hp: 45
                  attack: 49
                  type: "Grass"
                  pokedexNumber: 1
                  imgUrl: "https://assets.pokemon.com/assets/cms2/img/pokedex/full/001.png"
                  createdAt: "2024-01-22T23:13:13.000Z"
                  updatedAt: "2024-01-22T23:13:13.000Z"
                - id: 2
                  name: "Ivysaur"
                  hp: 60
                  attack: 62
                  type: "Grass"
                  pokedexNumber: 2
                  imgUrl: "https://assets.pokemon.com/assets/cms2/img/pokedex/full/002.png"
                  createdAt: "2024-01-22T23:13:13.000Z"
                  updatedAt: "2024-01-22T23:13:13.000Z"
                - id: 4
                  name: "Charmander"
                  hp: 39
                  attack: 52
                  type: "Fire"
                  pokedexNumber: 4
                  imgUrl: "https://assets.pokemon.com/assets/cms2/img/pokedex/full/004.png"
                  createdAt: "2024-01-22T23:13:13.000Z"
                  updatedAt: "2024-01-22T23:13:13.000Z"
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noToken:
                  value:
                    error: "No token provided"
                  summary: Token manquant
                invalidToken:
                  value:
                    error: "Invalid or expired token"
                  summary: Token invalide
        '500':
          description: Erreur serveur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Internal server error"
